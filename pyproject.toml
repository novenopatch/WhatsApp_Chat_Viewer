[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-chat-viewer"
version = "1.4.0"
description = "Convert WhatsApp chat exports into interactive HTML viewer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "BlueTechTG", email = "dev@bluetechtg.com"}
]
keywords = ["whatsapp", "chat", "export", "html", "viewer", "converter"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]

dependencies = [
    "Pillow>=10.0.0",
    "python-dotenv>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-Pillow",
]
brotli = [
    "brotli>=1.0.9",
]

[project.scripts]
whatsapp-chat-viewer = "build:main"

[project.urls]
Homepage = "https://github.com/BlueTechTG/whatsapp-chat-viewer"
Repository = "https://github.com/BlueTechTG/whatsapp-chat-viewer"
Issues = "https://github.com/BlueTechTG/whatsapp-chat-viewer/issues"
Documentation = "https://github.com/BlueTechTG/whatsapp-chat-viewer#readme"

# ----------------------------------------------------------------------------
# Black - Code formatting
# ----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | \.eggs
    | build
    | dist
    | __pycache__
)/
'''

# ----------------------------------------------------------------------------
# isort - Import sorting
# ----------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]
known_third_party = ["PIL"]

# ----------------------------------------------------------------------------
# Ruff - Fast Python linter
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by black)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"tests/*.py" = ["S101"]  # allow assert in tests

# ----------------------------------------------------------------------------
# mypy - Static type checking
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
check_untyped_defs = true
disallow_untyped_defs = false  # Set to true for stricter checking
disallow_incomplete_defs = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "PIL.*"
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest - Testing
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

# ----------------------------------------------------------------------------
# Coverage - Test coverage
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

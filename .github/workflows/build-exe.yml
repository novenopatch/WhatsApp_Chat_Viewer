name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.5.0)'
        required: true
        default: 'v1.5.0'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            binary_name: whatsapp-chat-viewer
            artifact_name: whatsapp-chat-viewer-linux
          - os: macos-latest
            platform: macos
            binary_name: whatsapp-chat-viewer
            artifact_name: whatsapp-chat-viewer-macos
          - os: windows-latest
            platform: windows
            binary_name: whatsapp-chat-viewer.exe
            artifact_name: whatsapp-chat-viewer-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable (Linux/Mac)
        if: matrix.platform != 'windows'
        run: |
          pyinstaller whatsapp_chat_viewer.spec --clean --onefile

      - name: Build executable (Windows)
        if: matrix.platform == 'windows'
        run: |
          pyinstaller whatsapp_chat_viewer.spec --clean --onefile

      - name: Rename executable (Linux)
        if: matrix.platform == 'linux'
        run: |
          mv dist/whatsapp-chat-viewer dist/whatsapp-chat-viewer-linux

      - name: Rename executable (macOS)
        if: matrix.platform == 'macos'
        run: |
          mv dist/whatsapp-chat-viewer dist/whatsapp-chat-viewer-macos

      - name: Rename executable (Windows)
        if: matrix.platform == 'windows'
        run: |
          move dist\whatsapp-chat-viewer.exe dist\whatsapp-chat-viewer-windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary_name }}
          retention-days: 90

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/whatsapp-chat-viewer-linux/whatsapp-chat-viewer-linux
            artifacts/whatsapp-chat-viewer-macos/whatsapp-chat-viewer-macos
            artifacts/whatsapp-chat-viewer-windows/whatsapp-chat-viewer-windows.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
